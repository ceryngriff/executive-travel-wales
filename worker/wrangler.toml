name = "executive-travel-wales-chatbot"
main = "src/index.js"
compatibility_date = "2026-06-16"
workers_dev = true

# Per-user conversation memory for Facebook Messenger (one message at a time).
[[kv_namespaces]]
binding = "CHAT_HISTORY"
id = "3eac5d8ac4154d099ebc1c42bf55a58a"

# Non-secret configuration. Secrets (ANTHROPIC_API_KEY, RESEND_API_KEY,
# BOOKING_TO_EMAIL, BOOKING_FROM_EMAIL, and for Messenger:
# MESSENGER_PAGE_TOKEN, MESSENGER_APP_SECRET) are set with
# `wrangler secret put NAME`, or in worker/.dev.vars for `wrangler dev`. See README.
[vars]
ALLOWED_ORIGINS = "https://executivetravel.wales,https://www.executivetravel.wales"
EMAIL_PROVIDER = "resend"
CLAUDE_MODEL = "claude-sonnet-4-6"
# Evans Taxi app booking intake (the INTAKE_API_KEY secret authenticates to it).
TAXI_INTAKE_URL = "https://evanstaxis.com/api/v1/bookings/intake"
# Facebook Messenger webhook verify token — paste this exact value into Meta's
# webhook setup ("Verify Token"). Not a secret, but keep it unguessable.
MESSENGER_VERIFY_TOKEN = "etw-messenger-7c41ad92e6"
# Business facts used to build the system prompt.
BUSINESS_TAGLINE = "Premium minibus and coach hire across South Wales, for airport transfers, corporate travel and events."
BUSINESS_PHONE = "07312000444"
BUSINESS_EMAIL = "evanstaxismerthyr@hotmail.co.uk"
BUSINESS_HOURS = "24/7"
BUSINESS_AREAS = "Based in Merthyr Tydfil, covering Cardiff, Newport, Swansea and all of South Wales. UK-wide on request."
BUSINESS_SERVICES = "Airport transfers, corporate travel, weddings and events, tours, group transport and private hire."
BUSINESS_FLEET = "Modern fleet with DBS-checked drivers: executive cars (up to 3 passengers), minibuses (8 and 16 seats) and coaches (24 and 28 seats)."
BUSINESS_AIRPORTS = "Fixed-route prices run from Merthyr Tydfil to Bristol, Cardiff, Birmingham, Heathrow and Gatwick airports. Other UK airports are quoted on request."
BUSINESS_PRICING_POLICY = "Live estimates for fixed Merthyr Tydfil to airport routes, shown as an estimate confirmed at booking. Any other pickup, destination or special request is a personalised callback. Never quote a firm price outside the quoting engine."
BUSINESS_BOOKING_NOTES = "Airport transfers include flight tracking and punctual pickups. Bespoke itineraries for groups and tours."
